server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
shopsphere:
  product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  jwt-secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}
