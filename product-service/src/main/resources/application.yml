server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: product-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    secret: ${JWT_SECRET}
  internal-token: ${INTERNAL_SERVICE_TOKEN}

storage:
  s3:
    bucket: ${IMAGE_BUCKET:}
  cdn:
    base-url: ${IMAGE_CDN_BASE_URL:}
