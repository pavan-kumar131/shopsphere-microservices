server:
  port: 8081
spring:
  application:
    name: auth-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
app:
  admin:
    email: ${ADMIN_EMAIL:admin@shopsphere.local}
    password: ${ADMIN_PASSWORD}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  iam-url: ${IAM_SERVICE_URL:http://iam-service:8087}
