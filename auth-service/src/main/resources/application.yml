server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 15
app:
  admin:
    email: ${ADMIN_EMAIL:admin@shopsphere.local}
    password: ${ADMIN_PASSWORD:AdminDemo123!}
