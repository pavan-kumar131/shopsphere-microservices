worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format sized '$remote_addr $request_method $uri $status request_bytes=$request_length response_bytes=$bytes_sent body_bytes=$body_bytes_sent gzip_ratio=$gzip_ratio request_time=$request_time';
  access_log /dev/stdout sized;
  error_log /dev/stderr warn;
  sendfile on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;
  # Modern clients may advertise br; gzip remains the interoperable fallback.
  # Nginx only selects a supported encoding from Accept-Encoding.
  client_max_body_size 8m;
  upstream customer_ui { server customer-frontend:3000; }
  upstream seller_ui { server seller-frontend:3000; }
  upstream admin_ui { server admin-frontend:3000; }
  upstream api_gateway { server api-gateway:8080; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ { proxy_pass http://api_gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Authorization $http_authorization; }
    location /seller/ { proxy_pass http://seller_ui; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /seller { return 302 /seller/; }
    location /admin/ { proxy_pass http://admin_ui; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /admin { return 302 /admin/; }
    location / { proxy_pass http://customer_ui; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
