AWSTemplateFormatVersion: '2010-09-09'
Description: ShopSphere demo runtime on ECS Fargate, ALB, private PostgreSQL, Secrets Manager and Cloud Map.
Parameters:
  ProjectName:
    Type: String
    Default: shopsphere
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
  VpcCidr: { Type: String, Default: 10.40.0.0/16 }
  PublicSubnet1Cidr: { Type: String, Default: 10.40.1.0/24 }
  PublicSubnet2Cidr: { Type: String, Default: 10.40.2.0/24 }
  PrivateSubnet1Cidr: { Type: String, Default: 10.40.11.0/24 }
  PrivateSubnet2Cidr: { Type: String, Default: 10.40.12.0/24 }
  FrontendImage: { Type: String, Description: Customer frontend ECR URI with immutable tag }
  SellerFrontendImage: { Type: String, Description: Seller frontend ECR URI with immutable tag }
  AdminFrontendImage: { Type: String, Description: Admin frontend ECR URI with immutable tag }
  NginxImage: { Type: String, Description: Nginx reverse proxy ECR URI with immutable tag }
  GatewayImage: { Type: String, Description: Full ECR URI including immutable tag }
  AuthImage: { Type: String, Description: Full ECR URI including immutable tag }
  ProductImage: { Type: String, Description: Full ECR URI including immutable tag }
  OrderImage: { Type: String, Description: Full ECR URI including immutable tag }
  AdminEmail: { Type: String, Default: admin@shopsphere.local, AllowedPattern: '.+@.+' }
  DbInstanceClass: { Type: String, Default: db.t3.micro, AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro, db.t4g.small] }
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the public HTTP load balancer. Restrict this in real environments.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties: { RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway }
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-a' }]
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-b' }]
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-a' }]
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-b' }]
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRouteTable }
  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRouteTable }
  PrivateSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateSubnetRouteTable }
  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateSubnetRouteTable }
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP entry to ShopSphere ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedHttpCidr }
      SecurityGroupEgress: [{ IpProtocol: -1, CidrIp: 0.0.0.0/0 }]
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tasks accept traffic only from the ALB or gateway
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup }
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      SecurityGroupEgress: [{ IpProtocol: -1, CidrIp: 0.0.0.0/0 }]
  InternalServiceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3002
      SourceSecurityGroupId: !Ref AppSecurityGroup
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL is accessible only from application tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }
      SecurityGroupEgress: [{ IpProtocol: -1, CidrIp: 0.0.0.0/0 }]
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private ShopSphere database subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/database'
      Description: ShopSphere PostgreSQL credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"shopsphere_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/jwt'
      Description: Base64-compatible signing secret for the demo JWT implementation
      GenerateSecretString:
        SecretStringTemplate: '{"secret":""}'
        GenerateStringKey: secret
        PasswordLength: 43
        ExcludePunctuation: true
  AdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/admin'
      Description: Initial admin password; retrieve it from Secrets Manager after deployment
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: false
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: ecommerce
      MasterUsername: shopsphere_app
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-cluster'
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: 14
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: ReadShopSphereSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref DatabaseSecret, !Ref JwtSecret, !Ref AdminSecret]
  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['Content-Type']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 3 }
  ProductImagesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-images-oac'
        Description: Private S3 product image origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  ProductImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} product images'
        DefaultRootObject: index.html
        Origins:
          - Id: product-images-s3
            DomainName: !GetAtt ProductImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ProductImagesOAC.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: product-images-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues: { QueryString: false, Cookies: { Forward: none } }
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        PriceClass: PriceClass_100
  ProductImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProductImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${ProductImagesBucket.Arn}/*'
            Condition: { StringEquals: { 'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ProductImagesDistribution}' } }
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ProductImagesBucket.Arn, !Sub '${ProductImagesBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: ProductImageUploads
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${ProductImagesBucket.Arn}/products/*'
  DiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties: { Name: !Sub '${ProjectName}.local', Vpc: !Ref Vpc, Description: ShopSphere internal service discovery }
  GatewayDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: api-gateway
      NamespaceId: !Ref DiscoveryNamespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  AuthDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: auth-service
      NamespaceId: !Ref DiscoveryNamespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  ProductDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: product-service
      NamespaceId: !Ref DiscoveryNamespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  OrderDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: order-service
      NamespaceId: !Ref DiscoveryNamespace
      DnsConfig: { DnsRecords: [{ Type: A, TTL: 10 }], RoutingPolicy: MULTIVALUE }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-web'
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 80
      HealthCheckEnabled: true
      HealthCheckPath: /
      Matcher: { HttpCode: '200-399' }
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-api'
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckEnabled: true
      HealthCheckPath: /actuator/health
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AttachGateway
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref AlbSecurityGroup]
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }]
  ApiRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions: [{ Field: path-pattern, Values: ['/api/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref GatewayTargetGroup }]
  ActuatorRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions: [{ Field: path-pattern, Values: ['/actuator/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref GatewayTargetGroup }]
  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-frontend'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: customer-frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment: [{ Name: NODE_ENV, Value: production }, { Name: PORT, Value: '3000' }, { Name: NEXT_PUBLIC_API_BASE_URL, Value: '' }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: customer } }
          HealthCheck: { Command: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3000/ >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 60 }
        - Name: seller-frontend
          Image: !Ref SellerFrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3001, Protocol: tcp }]
          Environment: [{ Name: NODE_ENV, Value: production }, { Name: PORT, Value: '3001' }, { Name: NEXT_PUBLIC_API_BASE_URL, Value: '' }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: seller } }
          HealthCheck: { Command: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3001/seller >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 60 }
        - Name: admin-frontend
          Image: !Ref AdminFrontendImage
          Essential: true
          PortMappings: [{ ContainerPort: 3002, Protocol: tcp }]
          Environment: [{ Name: NODE_ENV, Value: production }, { Name: PORT, Value: '3002' }, { Name: NEXT_PUBLIC_API_BASE_URL, Value: '' }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix admin } }
          HealthCheck: { Command: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:3002/admin >/dev/null || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 60 }
        - Name: nginx
          Image: !Ref NginxImage
          Essential: true
          PortMappings: [{ ContainerPort: 80, Protocol: tcp }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix nginx } }
          HealthCheck: { Command: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/ || exit 1'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 15 }
  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-gateway'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api-gateway
          Image: !Ref GatewayImage
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          Environment: [{ Name: AUTH_SERVICE_URL, Value: !Sub 'http://auth-service.${ProjectName}.local:8081' }, { Name: PRODUCT_SERVICE_URL, Value: !Sub 'http://product-service.${ProjectName}.local:8082' }, { Name: ORDER_SERVICE_URL, Value: !Sub 'http://order-service.${ProjectName}.local:8084' }, { Name: SERVER_PORT, Value: '8080' }]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: gateway }
          HealthCheck: { Command: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 90 }
  AuthTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-auth'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: auth-service
          Image: !Ref AuthImage
          Essential: true
          PortMappings: [{ ContainerPort: 8081, Protocol: tcp }]
          Environment:
            - { Name: SERVER_PORT, Value: '8081' }
            - { Name: SPRING_DATASOURCE_URL, Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/ecommerce' }
            - { Name: SPRING_DATASOURCE_USERNAME, Value: shopsphere_app }
            - { Name: ADMIN_EMAIL, Value: !Ref AdminEmail }
          Secrets:
            - { Name: SPRING_DATASOURCE_PASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::' }
            - { Name: JWT_SECRET, ValueFrom: !Sub '${JwtSecret}:secret::' }
            - { Name: ADMIN_PASSWORD, ValueFrom: !Sub '${AdminSecret}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: auth }
          HealthCheck: { Command: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8081/actuator/health | grep -q UP'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 90 }
  ProductTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-product'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: product-service
          Image: !Ref ProductImage
          Essential: true
          PortMappings: [{ ContainerPort: 8082, Protocol: tcp }]
          Environment:
            - { Name: SERVER_PORT, Value: '8082' }
            - { Name: IMAGE_BUCKET, Value: !Ref ProductImagesBucket }
            - { Name: IMAGE_CDN_BASE_URL, Value: !Sub 'https://${ProductImagesDistribution.DomainName}' }
            - { Name: SPRING_DATASOURCE_URL, Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/ecommerce' }
            - { Name: SPRING_DATASOURCE_USERNAME, Value: shopsphere_app }
          Secrets:
            - { Name: SPRING_DATASOURCE_PASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::' }
            - { Name: JWT_SECRET, ValueFrom: !Sub '${JwtSecret}:secret::' }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: product }
          HealthCheck: { Command: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8082/actuator/health | grep -q UP'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 90 }
  OrderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-order'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: order-service
          Image: !Ref OrderImage
          Essential: true
          PortMappings: [{ ContainerPort: 8084, Protocol: tcp }]
          Environment:
            - { Name: SERVER_PORT, Value: '8084' }
            - { Name: PRODUCT_SERVICE_URL, Value: !Sub 'http://product-service.${ProjectName}.local:8082' }
            - { Name: SPRING_DATASOURCE_URL, Value: !Sub 'jdbc:postgresql://${Database.Endpoint.Address}:5432/ecommerce' }
            - { Name: SPRING_DATASOURCE_USERNAME, Value: shopsphere_app }
          Secrets:
            - { Name: SPRING_DATASOURCE_PASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::' }
            - { Name: JWT_SECRET, ValueFrom: !Sub '${JwtSecret}:secret::' }
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: order }
          HealthCheck: { Command: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8084/actuator/health | grep -q UP'], Interval: 30, Timeout: 5, Retries: 3, StartPeriod: 90 }
  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${ProjectName}-frontend'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200, DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration: { AwsvpcConfiguration: { AssignPublicIp: ENABLED, Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2], SecurityGroups: [!Ref AppSecurityGroup] } }
      TaskDefinition: !Ref FrontendTaskDefinition
      LoadBalancers: [{ ContainerName: nginx, ContainerPort: 80, TargetGroupArn: !Ref FrontendTargetGroup }]
  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: [ApiRoute, ActuatorRoute]
    Properties:
      ServiceName: !Sub '${ProjectName}-api-gateway'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200, DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration: { AwsvpcConfiguration: { AssignPublicIp: ENABLED, Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2], SecurityGroups: [!Ref AppSecurityGroup] } }
      TaskDefinition: !Ref GatewayTaskDefinition
      ServiceRegistries: [{ RegistryArn: !GetAtt GatewayDiscovery.Arn, Port: 8080 }]
      LoadBalancers: [{ ContainerName: api-gateway, ContainerPort: 8080, TargetGroupArn: !Ref GatewayTargetGroup }]
  AuthService:
    Type: AWS::ECS::Service
    DependsOn: [Database, AuthDiscovery]
    Properties:
      ServiceName: !Sub '${ProjectName}-auth-service'
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
